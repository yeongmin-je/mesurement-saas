name: metroai-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: metroai-postgres
    environment:
      POSTGRES_USER: metroai
      POSTGRES_PASSWORD: password
      POSTGRES_DB: metroai_db
    ports:
      - "5432:5432"
    volumes:
      - metroai_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metroai -d metroai_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: metroai-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: metroai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - metroai_minio:/data

volumes:
  metroai_pg:
  metroai_minio:
